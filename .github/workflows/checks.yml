name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: false
      - name: Install locked development tools
        run: uv sync --frozen --python 3.11
      - name: Run the same gates as local hooks
        run: uv run --frozen prek run --all-files
      - name: Build distributions
        run: uv run --frozen python -m build
      - name: Verify clean wheel installation
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/speech-sdk-runtime.txt
          uv venv /tmp/speech-sdk-wheel --python 3.11
          uv pip install --python /tmp/speech-sdk-wheel/bin/python --require-hashes -r /tmp/speech-sdk-runtime.txt
          uv pip install --python /tmp/speech-sdk-wheel/bin/python --no-deps dist/*.whl
          mkdir -p /tmp/speech-sdk-installed/tests
          cp tests/test_api.py tests/test_azure.py tests/test_streaming.py tests/test_smoke.py tests/test_pronunciations.py /tmp/speech-sdk-installed/tests/
          cp -r smoke /tmp/speech-sdk-installed/
          cd /tmp/speech-sdk-installed
          env -u XAI_API_KEY -u OPENAI_API_KEY /tmp/speech-sdk-wheel/bin/python -m unittest discover -s tests -v
          /tmp/speech-sdk-wheel/bin/python -c 'from importlib.resources import files; import speech_sdk; assert files(speech_sdk).joinpath("py.typed").is_file(); assert "site-packages" in speech_sdk.__file__'

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.18'
          enable-cache: false
      - name: Install only locked runtime dependencies
        run: uv sync --frozen --no-dev --python "${{ matrix.python }}"
      - name: Offline SDK tests (no Radon/tooling imports)
        env:
          PYTHONPATH: tests
        run: >-
          env -u XAI_API_KEY -u OPENAI_API_KEY
          uv run --frozen --no-dev python -m unittest -v
          test_core test_http test_openai test_azure test_xai test_api test_streaming test_smoke test_pronunciations
